name: Build GKI Kernel Module
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download GKI kernel source
        uses: android/gki-kernel-build-action@main

      - name: Build module
        run: make -C $GKI_KERNEL_PATH M=$PWD modules

      - name: Upload ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-module
          path: module.ko
